# Improve colors
set -g default-terminal "screen-256color"

# Set scrollback buffer to 10000
set -g history-limit 10000

# Host colors and labels are set by each host's programs.tmux.extraConfig.
set -g status-style fg=colour250,bg=colour235
set -g pane-border-style fg=colour238
set -g pane-active-border-style "fg=#{@host-color}"

# Customize window list
setw -g window-status-style fg=colour245
setw -g window-status-current-style "fg=black,bg=#{@host-color},bold"
setw -g window-status-format " #I #W "
setw -g window-status-current-format " #I #W "

# Set status bar content
set -g status-left-length 40
set -g status-left "#[fg=black,bg=#{@host-color},bold] #{@host-label} #[default] #S  "
set -g status-right "#[fg=colour245]%d %b #[fg=#{@host-color}]%R "

# Keep current working dir when splitting window 
bind-key v split-window -h -c "#{pane_current_path}"
bind-key b split-window -v -c "#{pane_current_path}"

# Swap panes using 
bind-key J swap-pane -D
bind-key K swap-pane -U

# Easy config reload
bind-key r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded."

# Remap prefix from 'C-b' to 'C-a'
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# Additional window controls
bind-key n next-window
bind-key p previous-window
bind-key l last-window
bind-key w choose-window

# VIM keys for pane nav
bind-key h select-pane -L
bind-key l select-pane -R
bind-key j select-pane -D
bind-key k select-pane -U

# Don't snap to bottom on mouse copy or click while in copy mode
unbind -T copy-mode-vi MouseDragEnd1Pane
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe "wl-copy"
bind-key -T copy-mode-vi MouseDown1Pane select-pane

