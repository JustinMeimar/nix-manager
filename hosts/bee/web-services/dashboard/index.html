<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8f8f6">
  <title>Dashboards · Bee farm</title>
  <style>
    :root { color-scheme: light; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #242424; background: #f8f8f6; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; min-height: 100svh; margin: 0; display: grid; place-items: center; padding: 3rem 1.25rem; }
    main { width: min(100%, 38rem); }
    header { text-align: center; margin-bottom: 2.5rem; }
    h1 { margin: 0 0 .5rem; font-family: Georgia, "Times New Roman", serif; font-size: clamp(2.5rem, 7vw, 3.7rem); font-weight: 400; letter-spacing: -.055em; line-height: 1.1; }
    .intro { margin: 0; color: #666; line-height: 1.6; }
    ul { margin: 0; padding: 0; border-top: 1px solid #d8d8d4; list-style: none; }
    li { border-bottom: 1px solid #d8d8d4; }
    li a { display: flex; align-items: center; justify-content: space-between; gap: 1rem; overflow-wrap: anywhere; padding: 1rem .25rem; color: #242424; font-weight: 500; text-decoration: none; transition: padding .2s, background .2s; }
    li a:hover, li a:focus-visible { padding-left: .7rem; padding-right: .7rem; background: #ededeb; }
    a:focus-visible { outline: 2px solid #242424; outline-offset: 3px; }
    li a span { flex: none; color: #777; }
    .status { color: #666; text-align: center; }
    .status:empty { display: none; }
    .back { display: block; width: fit-content; margin: 2rem auto 0; color: #555; font-size: .9rem; text-underline-offset: .2em; }
    @media (prefers-reduced-motion: reduce) { li a { transition: none; } }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Dashboards</h1>
      <p class="intro">Shareable HTML dashboards</p>
    </header>
    <p class="status" id="status">Finding dashboards…</p>
    <ul id="dashboards" aria-label="Dashboards"></ul>
    <a class="back" href="https://bee.justinmeimar.com/">← Back to Bee farm</a>
    <noscript><p><a href="/__listing__/">View the plain file listing</a></p></noscript>
  </main>
  <script>
    (async () => {
      const list = document.getElementById('dashboards');
      const status = document.getElementById('status');
      try {
        const response = await fetch('/__listing__/', { cache: 'no-store' });
        if (!response.ok) throw new Error('Listing unavailable');
        const files = (await response.json()).filter(file =>
          file.type === 'file' && !file.name.startsWith('.') && /\.html?$/i.test(file.name)
        );
        files.sort((a, b) => a.name.localeCompare(b.name));
        for (const file of files) {
          const item = document.createElement('li');
          const link = document.createElement('a');
          const arrow = document.createElement('span');
          link.href = '/' + encodeURIComponent(file.name);
          link.textContent = file.name;
          arrow.textContent = '↗';
          arrow.setAttribute('aria-hidden', 'true');
          link.append(arrow);
          item.append(link);
          list.append(item);
        }
        status.textContent = files.length ? '' : 'No dashboards here yet.';
      } catch (_) {
        status.textContent = 'The list is unavailable right now.';
      }
    })();
  </script>
</body>
</html>
